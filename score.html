<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="score_style.css">
	<script defer src="script.js"></script>
	<script defer src="score_script.js"></script>

	<title>Score</title>
	
</head>
<body>
	<header>
	  <div><img id="quiz_category_img" class="quest-category-icon icon-a11y" src="./assets/images/icon-accessibility.svg" alt="illustration of accessibility"><p id="title" class="a11y-category light-texts2">Accessibility</p></div>
	  <div class="theme-switch">
	    <div>
	      <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#626C7F" viewBox="0 0 24 24"><path d="M12 1.5a.75.75 0 0 1 .75.75v1.5a.75.75 0 1 1-1.5 0v-1.5A.75.75 0 0 1 12 1.5Zm0 15a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0-1.5a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm9.75-2.25a.75.75 0 1 0 0-1.5h-1.5a.75.75 0 1 0 0 1.5h1.5ZM12 19.5a.75.75 0 0 1 .75.75v1.5a.75.75 0 1 1-1.5 0v-1.5a.75.75 0 0 1 .75-.75Zm-8.25-6.75a.75.75 0 1 0 0-1.5h-1.5a.75.75 0 1 0 0 1.5h1.5Zm.969-8.031a.75.75 0 0 1 1.062 0l1.5 1.5a.751.751 0 0 1-1.062 1.062l-1.5-1.5a.75.75 0 0 1 0-1.062Zm1.062 14.562a.75.75 0 1 1-1.062-1.06l1.5-1.5a.75.75 0 1 1 1.062 1.06l-1.5 1.5Zm13.5-14.562a.75.75 0 0 0-1.062 0l-1.5 1.5a.751.751 0 0 0 1.062 1.062l1.5-1.5a.75.75 0 0 0 0-1.062Zm-1.062 14.562a.75.75 0 0 0 1.062-1.06l-1.5-1.5a.75.75 0 0 0-1.062 1.06l1.5 1.5Z"/></svg>
	    </div>
	    <div>
	      <label class="switch">
	      <input type="checkbox"/>
	      <span></span>
	      </label>
	    </div>
	    <div>
	      <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#626C7F" viewBox="0 0 24 24"><path d="M11.775 4.522A7.5 7.5 0 1 1 4.898 16.09c2.104-.57 4.974-1.953 6.24-5.326.828-2.211.876-4.408.637-6.241ZM20.184 12a8.997 8.997 0 0 0-9.315-8.994.75.75 0 0 0-.713.888c.345 1.821.42 4.092-.424 6.342-1.2 3.201-4.203 4.26-6.115 4.606a.75.75 0 0 0-.542 1.066A9 9 0 0 0 20.184 12Z"/></svg>
	    </div>
	  </div>
	</header>
	<main>
		<div>
			<h1 class="quiz-status light-texts2">
				<span id="quiz_completed">Quiz completed</span>
				<span>You scored...</span>
			</h1>
		</div>
		<div>
			<div class="score-card light-block">
				<p class="">
					<span class=""><img id="quiz_category_img1" class="a11y-icon" src="./assets/images/icon-accessibility.svg" alt="illustration of accessibility"></span>
					<span class="a11y" id="quiz_category">Accessibility</span>
				</p>

				<p>
					<span id="obtained_score" class="score">_</span>
					<span class="total-score light-texts1">out of 10</span>
				</p>
			</div>
			<button class="play-again-btn" id="play_again_btn">Play Again</button>
		</div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script> <!-- source: https://confettijs.org/ -->
</body>
</html>
